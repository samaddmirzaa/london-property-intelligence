name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install pytest httpx
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v
