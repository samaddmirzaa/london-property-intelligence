name: Monthly data refresh

on:
  schedule:
    - cron: '0 6 25 * *'    # 06:00 on the 25th, after the monthly crime, house price and rent releases
  workflow_dispatch:         # plus a button to run it by hand

permissions:
  contents: write            # lets the job push the refreshed data

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install beautifulsoup4 openpyxl pytest httpx
          pip install -e .

      - name: Refresh the data
        run: python -m london_property.refresh | tee -a $GITHUB_STEP_SUMMARY

      - name: Test the refreshed data
        run: pytest tests/ -q

      - name: Commit the new data if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/area
          git diff --cached --quiet || (git commit -m 'Monthly data refresh' && git push)